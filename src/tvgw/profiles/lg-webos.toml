# What to do on any LG before trusting the room is private (the checklist `tvgw profile` prints).
[checklist]
audio = [
  "Settings > Support > Privacy & Terms (or General > Additional Settings > User Agreements): decline Voice Information; a declined agreement makes the remote's mic show a consent prompt instead of recording (verified on the CX)",
  "Settings > General > AI Service: turn Hands-free Voice Control off on far-field models; do not trust the toggle alone (Gamers Nexus found capture continuing after commands)",
  "Settings > General > AI Service: AI Voice ID / voice recognition off; Alexa, Google Assistant and Copilot: not signed in",
  "Leave the speech back-ends blocked in the profile (Google Assistant, Alexa AVS, Dangbei, LG netflixvoice/lgthinq): a wall, not a checkbox",
  "After a firmware update re-read these settings (`tvgw tvcheck`) and watch the brief's Firmware section for new names",
  "On a far-field model, run a capture during a 'Hi LG' attempt with the agreement declined: the brief's top upload must show nothing new",
]
acr = [
  "Settings > General > Additional Settings (or Support > Privacy): Live Plus off; the hourly `tvgw tvcheck` warns if it comes back",
  "Home Promotion, Content Recommendation, Personalized Advertising, Limit Ad Tracking: off / on respectively",
  "Expect the ACR client to keep calling its provisioning host (prov-lg.alphonso.tv) even when off: it is blocked, and the brief lists the retries",
]
