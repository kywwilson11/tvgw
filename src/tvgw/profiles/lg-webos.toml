# What to do on any LG before trusting the room is private (the checklist `tvgw profile` prints).
[checklist]
audio = [
  "Settings > Support > Additional Settings > User Agreements (webOS 5) or Support > Privacy & Terms > User Agreements (webOS 6 and later): decline Voice Information; a declined agreement makes the remote's mic show a consent prompt instead of recording (verified on the CX)",
  "Settings > General > AI Service: turn Hands-free Voice Control off on far-field models; do not trust the toggle alone (Gamers Nexus found capture continuing after commands)",
  "Settings > General > AI Service: AI Voice ID / voice recognition off; Alexa, Google Assistant and Copilot: not signed in",
  "Leave the speech back-ends blocked in the profile (Google Assistant, Alexa AVS, Dangbei, LG netflixvoice/lgthinq): a wall, not a checkbox",
  "After a firmware update re-read these settings (`tvgw tvcheck`) and watch the brief's Firmware section for new names",
  "On a far-field model, run a capture during a 'Hi LG' attempt with the agreement declined: the brief's top upload must show nothing new",
]
network = [
  "Settings > Connection > Wi-Fi Connection: with the toggle ON, select the saved home network and press the X on its entry to forget it (webOS 5; the list is hidden while the toggle is off), then turn Wi-Fi off. The wire through the gateway must be the TV's only path; the LAN API cannot do this (writes are refused on 04.64)",
  "Confirm from the gateway: the TV's Wi-Fi MAC must not appear on the home network and only the wired address may ask AdGuard",
]
acr = [
  "Settings > General > Additional Settings (or Support > Privacy): Live Plus off; the hourly `tvgw tvcheck` warns if it comes back",
  "Home Promotion, Content Recommendation, Personalized Advertising, Limit Ad Tracking: off / on respectively",
  "Expect the ACR client to keep calling its provisioning host (prov-lg.alphonso.tv) even when off: it is blocked, and the brief lists the retries",
]

# ---- LAN APIs and privacy settings (profile format v2, design decision 31) -------------
# Reference records: they block nothing. `provenance = "verified"` only for what the CX showed this
# project (with the kind of evidence); everything else is "unverified" with the URLs it came from and
# the grade of the best of them (peer-reviewed, community, spec, low). R&D survey 6.1 and 6.4.
[[lan_api]]
name = "SSAP over TLS (webOS second screen)"
port = 3001
protocol = "wss"
tls = "self-signed"
pairing = "on-screen prompt on first connect; the client key, and the manifest it was made with, are kept in /var/lib/tvgw/lgtv-keys.sqlite"
discovery = "SSDP urn:lge-com:service:webos-second-screen:1"
generations = ["5"]
reads = ["power state", "foreground app", "option.livePlus", "option.audioGuidance", "network.deviceName", "eulaStatus", "connectionmanager/getstatus", "model and firmware", "hello: deviceOSReleaseVersion"]
write = "refused"
read_only = "everything: writes through the createAlert Luna bridge are refused on firmware 04.64 ('isCallAllowed reply returnValue false'), so settings and saved Wi-Fi networks change only on the TV itself"
provenance = "verified"
evidence = "lan-api"
notes = ["read hourly by `tvgw tvcheck` (src/tvgw/lgwebos.py) and held by `tvgw tvprobe`; re-tested 2026-10-27", "until 2026-11-04 this record said port 3000 over ws, which the CX refuses: the reader has used wss 3001 throughout"]

[[lan_api]]
name = "SSAP without TLS"
port = 3000
protocol = "ws"
generations = ["5", "6", "22", "23", "24", "25", "26"]
reads = []
write = "unknown"
notes = ["refused ('Connection reset by peer') on an OLED55CXPUA at 04.64.00; gone on 2022+ sets since the 2023 firmware wave (C2 03.30.16); a 2025 set accepts the connection and then hangs for minutes after power-on (aiowebostv #744): never try it, never fall back to it", "a C8 on webOS 4 still answers on it (2026-10)"]
provenance = "unverified"
grade = "community"
sources = ["https://github.com/home-assistant-libs/aiowebostv/issues/744", "https://github.com/hobbyquaker/lgtv2/issues/48"]

[[lan_api]]
name = "SSAP over TLS, webOS 24 to 26"
port = 3001
protocol = "wss"
tls = "self-signed"
pairing = "on-screen prompt; webOS 26 (43.20+) and some webOS 25 firmware refuse a manifest with a signatures block ('403 Pairing rejected: blacklisted certificate detected', no prompt); tvgw's unsigned read-only manifest pairs"
discovery = "SSDP urn:lge-com:service:webos-second-screen:1"
generations = ["24", "25", "26"]
reads = ["eulaStatus", "eulaInfoNetwork", "option.livePlus", "option.quickStartMode", "general.alwaysOn", "general.homePromotion", "other.ueiEnable", "support.automaticUpdate", "network.bleAdvertisingOnOff", "hello: deviceOSReleaseVersion (getCurrentSWInformation answers 401 on webOS 26)"]
write = "refused"
read_only = "setSystemSettings answers 401 to an unsigned manifest (aiowebostv #728); the createAlert Luna bridge is reported open, and tvgw does not use it"
provenance = "unverified"
grade = "community"
sources = [
  "https://github.com/chros73/bscpylgtv/blob/master/docs/available_settings_G6.md",
  "https://github.com/home-assistant-libs/aiowebostv/issues/718",
  "https://github.com/home-assistant-libs/aiowebostv/issues/728",
]

[[privacy_setting]]
name = "Live Plus"
controls = "automatic content recognition (LG Ad Solutions / Alphonso): a fingerprint of the screen, HDMI inputs included, sent every few seconds"
recommended = "off"
key = "option.livePlus"
menu = { "webOS 5" = "Settings > General > Additional Settings > Live Plus" }
opt_out_effective = "partly on the CX: with it off the ACR client still calls its provisioning host prov-lg.alphonso.tv (blocked here, see [checklist] acr); both studies found that LG's opt-out stops the fingerprint uploads (IMC 2024, PoPETs 2027)"
notes = ["`tvgw tvcheck` reads it hourly and the brief raises a red line when it is not off; a firmware update may reset it"]
provenance = "verified"
evidence = "lan-api"
sources = ["https://arxiv.org/abs/2409.06203", "https://watchingthewatchers.github.io/watchingthewatchers/paper.html"]

