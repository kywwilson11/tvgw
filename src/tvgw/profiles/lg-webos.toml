# tvgw profile: LG webOS televisions.
# Built from an LG CX (OLED55CXPUA, webOS 5.6.2, firmware 04.64.00) observed October 2026, the
# HaGeZi LG webOS list, Perflyst's Smart-TV list, hugobatista/lg-tv-ad-block, the IMC 2024 ACR
# study (arXiv 2409.06203) and, for the newer webOS generations, community captures gathered on
# 2026-10-26 (HaGeZi #11412/#11438/#11474, webosbrew apps-repo #254, Level1Techs, furkan-bayrak,
# lifesgoodwithoutspying, glasshouse). Entries marked "unverified" were not seen on the CX.
# Longest matching pattern wins; "*" is a wildcard; a pattern also matches subdomains; the
# regional prefixes below are stripped before matching.
#
# Open owner decision (2026-11-04, research pass R2 finding 7; REPORTED, one owner of three newer LG sets,
# models not given): with `cdplauncher.lgtvcommon.com` and `lgchhomeapp.lgtvcommon.com` blocked, LG
# Channels would not open on those sets, and HaGeZi unblocked both names on 2026-09-23 (hagezi/dns-blocklists
# #11544) while keeping `cdpbeacon` and eight other lgtvcommon.com names blocked. tvgw blocks both in
# lg-webos.rules (telemetry and the LG Channels home-screen ad app); on the CX, LG Channels was not seen
# broken. The same research says (REPORTED, not measured here) that `lgsmartad.com` also serves Content
# Store cover art and `cdpsvc.lgtvcommon.com` the LG Channels guide. The rules stand until the owner
# decides (decision 16's pattern: a cost written down, or a per-generation exception); nothing here changes
# them. `ad.lgappstv.com` and `lgad.cjpowercast.com.edgesuite.net` answer NXDOMAIN (2026-11-04): dead hosts,
# kept in the rules for history.

[profile]
name = "lg-webos"
vendor = "LG"
description = "LG webOS smart TVs (verified on CX / webOS 5)"
# (W12) the country whose LG hosts the must-allow list names when the TV has not said (`{cc}` below): the
# reference CX is a US set. TV_COUNTRY in the settings, or the country the TV reports, fills it otherwise
default_country = "us"
# the TV doing its job: allowed names in these categories are expected; anything else allowed is
# surfaced by the daily brief as a candidate or a rule gap
expected_categories = ["Streaming", "Infra", "LG core", "FAST"]
# webOS has no battery clock and NTP is off by default: the time comes from LG's SDP reply
# (X-Server-Time). <cc>.lgtvsdp.com up to webOS 5/6, <cc>.nextlgsdp.com from webOS 6/22 on.
# the country host only (us., gb., de. ...): rdx2.lgtvsdp.com under the same zone is telemetry
clock_hosts = ["??.lgtvsdp.com", "??.nextlgsdp.com"]
# zones where one block at the apex took out clocks, stores, casting or firmware for someone
# amagi.tv: one zone delivers every Amagi FAST channel, so a block at its apex stops LG Channels playing
never_block_apex = ["lgtvsdp.com", "nextlgsdp.com", "lgtvcommon.com", "lge.com", "lgappstv.com", "lgeapi.com", "aws-prd.net", "wiselg.com", "amagi.tv"]

# How far the profile is tested, and what the TV's owner checks on the TV: `tvgw profile` prints it,
# and tools/docgen.py writes the support tables of the front page and docs/tv/ from it.
# Tested on the CX alone: a generation counts as tested only where its row is verified, so every other
# webOS generation is not yet tested
[support]
status = "tested"
tested_on = ["an LG CX (OLED55CX), software 04.64.00"]
you_check = "That the TV's Wi-Fi is off, until tvgw shows it can read it on your TV"

[categories]
strip_prefixes = ["aic.", "eic.", "kic.", "ruc.", "aic-", "eic-", "kic-", "ruc-"]
# screen fingerprinting / viewing data (LG Ad Solutions = Alphonso; Samba TV ran ACR on non-US
# sets until 2022-09 and Nielsen's library ships on some builds: unverified here)
ACR = ["alphonso.tv", "samba.tv", "nielsentam.tv"]
"LG ads" = [
  "lgsmartad.com", "lgads.tv", "adsmeasurement.com", "ad.lgappstv.com",
  "ibis.lgappstv.com", "ibs.lgappstv.com", "ibsstat.lgappstv.com", "ads.lgtvcommon.com",
  "adts.lgtvcommon.com", "videoads.lgtvcommon.com", "homeprv.lgtvcommon.com", "nudge.lgtvcommon.com",
  "recommend.lgtvcommon.com", "thinqrecommend.lgtvcommon.com", "lgad.cjpowercast.com.edgesuite.net",
  "itsmy.tv", "lgshopsvc.lgappstv.com",
  # LG Channels' home-screen ad app: blocked in lg-webos.rules, and "LG core" by its lgtvcommon.com suffix
  # until 2026-11-01, so the brief showed a blocked core name
  "lgchhomeapp.lgtvcommon.com",
  # the CNAME targets of <cc>.ad / <cc>.info.lgsmartad.com (AdGuard matches a rule against CNAMEs too)
  "*-ad-lgsmartad-com.aws-prd.net", "*-info-lgsmartad-com.aws-prd.net",
]
"LG telemetry" = [
  "cdpbeacon*.lgtvcommon.com", "cdpsvc.lgtvcommon.com", "cdplauncher.lgtvcommon.com", "rdl.lgtvcommon.com",
  "wiseconfig.lgtvcommon.com", "netflixvoice.lgtvcommon.com", "rdx2.lgtvsdp.com", "rdx2.nextlgsdp.com",
  "smartshare.lgtvsdp.com", "elastic.lgwebostv.com", "*-rdx2-lgtvsdp-com.aws-prd.net",
  # webOS 22+ (unverified here): usage counters/picture settings upload, store stats, CDP auth, diagnostics
  "ocp.lgtviot.com", "ibsstat.nextlgsdp.com", "cpauth.lgtvcommon.com", "rdth.lgtvcommon.com",
]
# device fingerprinting / IoT discovery / cloud push
# the Nevo hub as a pattern, as lg-webos.rules blocks it by regex: hub numbers and a prefix vary
"LG fingerprint" = ["ueiwsp.com", "quicksetcloud.com", "meethue.com", "*nevoai-iothub-*-prod.azure-devices.net"]
"LG IoT" = ["lgtviot.com", "lgthinq.com", "*-ats.iot.*.amazonaws.com", "qt2-kic.lab.lgtvcommon.com"]
# clock, firmware, content store, file service: the parts that must keep working
"LG core" = [
  "lgtvsdp.com", "snu.lge.com", "lgappstv.com", "lgrecommends.lgappstv.com", "ngfts.lge.com",
  "gfts.lge.com", "qt2-ngfts.lge.com", "lgtvonline.lge.com", "lgtvcommon.com", "lge.com", "lgeapi.com",
  # webOS 6/22+ backbone (clock, login, store, downloads) and LG's other delivery zones: unverified here
  "nextlgsdp.com", "ibs.nextlgsdp.com", "gfts.nextlgsdp.com", "ngfts.nextlgsdp.com", "wiselg.com",
  "ngfts.tv.wiselg.com", "security.lgtvsdp.com", "lgsmartplatform.com", "lgtvlink.com", "lggalleryplus.com",
]
"Voice" = [
  "embeddedassistant.googleapis.com", "avs-alexa-na.amazon.com", "avs-alexa-eu.amazon.com",
  "avs-alexa-fe.amazon.com", "api.amazonalexa.com", "dangbei.com",
]
"3rd-party ads" = [
  "imasdk.googleapis.com", "doubleclick.net", "amazon-adsystem.com", "wurl.dev", "wurl.tv", "smartclip.*",
  "yumenetworks.com", "service.idsync.analytics.yahoo.com",
  # app analytics / telemetry, grouped with ads
  "conviva.com", "browser-intake-datadoghq.com", "ichnaea.netflix.com", "customerevents.netflix.com",
  "telemetry.insights.video.a2z.com", "minerva.devices.a2z.com", "eligibility-panelresearch.googlevideo.com",
  "unagi-na.amazon.com", "unagi.amazon.com", "omtrdc.net", "imrworldwide.com", "scorecardresearch.com",
  "nr-data.net", "ingest.webcol.sdp.peacocktv.com",
  # audience measurement: Google's TV user panel / YouTube panel research, Neustar, Active Metering
  "userpaneltv-pa.googleapis.com", "*panelresearch.googlevideo.com", "agkn.com", "activemetering.com",
  "googlesyndication.com",
  # ad servers / SSPs seen on webOS 24-25 sets (unverified here), FreeWheel (Peacock's ad decisioning:
  # categorized, not blocked), Prime Video's client telemetry, a public-IP lookup before first frame
  "adstk.io", "brightline.tv", "fwmrm.net", "sonar.prime-video.amazon.dev", "api.ipify.org",
  # Max: WBD's "Telegraph" event API and MediaMelon's QoE/analytics beacons (both blocked by HaGeZi Pro)
  "telegraph.prd.api.discomax.com", "mediamelon.com", "newrelic.com",
  # the browser engine's own chatter (Chrome update/usage pings, WebRTC STUN discovery): no TV function
  "tools.google.com", "stun.services.mozilla.com",
]
Streaming = [
  "netflix.*", "nflximg.*", "nflxvideo.net", "nflxso.net", "nflxext.com", "bamgrid.com", "disneyplus.com",
  "dssott.com", "dssedge.com", "disney-plus.net", "pluto.tv", "ytimg.com", "youtube.com", "googlevideo.com",
  "ggpht.com", "googleusercontent.com", "cdn-apple.com", "aiv-cdn.net", "amazonvideo.com", "pv-cdn.net",
  "aiv-delivery.net", "api.amazon.com", "prime-video.amazon.dev", "ssl-images-amazon.com", "media-amazon.com",
  "images-amazon.com", "peacocktv.com", "nbcuott.com", "nvidiagrid.net",
  # Max (Warner Bros. Discovery): app API, media CDNs (seen 2026-10-26)
  "max.com", "discomax.com", "h264.io",
]
# Free ad-supported TV (FAST) delivery for LG Channels: the channels' video and manifests. Allowed and
# never blocked, since a block stops the channel (Watching the Watchers, 2026, Table 8); hence amagi.tv in
# never_block_apex. Amagi's names are title-bearing: the left label carries the channel id and a channel
# or programme slug (amgNNNNN-<slug>-<platform>.amagi.tv), so dns.qname, tls.sni and hosts.name hold a
# viewing record for these zones (docs/how-it-works/privacy-and-retention.md). From the 2026 lab set of a newer US LG
# (deep-dive 05, 1.8); whether the CX's LG Channels client uses the slug form is unverified.
FAST = [
  "amagi.tv", "wurllg.global.transmit.live", "fast.nbcuni.com", "lgchannels.ott-channels.stingray.com",
]
Infra = ["ocsp.*", "digicert.com", "ntp.*", "akamai*", "playready.microsoft.com", "go.microsoft.com",
  "gstatic.com", "googleapis.com", "cloudfront.net", "fastly.net", "fastly-edge.com"]

# Never block these, whatever a list says, and why. `{cc}` is the TV's country (two letters, lower case:
# the profile's default_country, TV_COUNTRY, or what the TV reports) and `{rg}` LG's regional prefix for it
# ([regions] below): LG names its clock, login and store hosts by country, and HaGeZi Pro, which every
# profile subscribes to, blocks 196 `<cc>.nextlgsdp.com` names and allows a country only after a report
# (2026-11-04), so a set outside the US loses its clock host unless its own country's name is here.
[must_allow]
"{cc}.lgtvsdp.com" = "clock sync at boot; if blocked the clock resets to 2019 and TLS fails everywhere"
"snu.lge.com" = "firmware updates (security fixes)"
"lgtvonline.lge.com" = "connectivity check; the TV thinks it is offline without it"
"{cc}.lgrecommends.lgappstv.com" = "the Content Store's landing page is this feed; the store fails without it (error 202 on a C9 too)"
"{rg}.service.lgtvcommon.com" = "Content Store / launcher services"
"{cc}.tvsdp.lgeapi.com" = "Content Store API"
# webOS 6/22+ (not this CX; from HaGeZi #11438 and Perflyst #172 breakage reports): clock, login and store
# on the newer SDP backbone, and the store's downloads. Harmless on older sets; protects against lists that
# block <cc>.nextlgsdp.com. Canada needed ca.nextlgsdp.com for the store, voice and login (Perflyst #167).
"{cc}.nextlgsdp.com" = "clock + login + store on webOS 6/22+ (blocked: clock resets after power loss, TLS fails, store error P6.48.SZ)"
"ngfts.nextlgsdp.com" = "Content Store icons/images on webOS 6+"
"{rg}-gfts.nextlgsdp.com" = "Content Store downloads/updates on webOS 6+ (eic-/kic- outside the Americas)"

# (W12) LG's regional prefixes by country, for `{rg}`: aic (the Americas; the default for a country listed
# nowhere), eic (Europe, the Middle East, Africa), kic (Asia and the Pacific), ruc (Russia). The prefixes
# are seen in the field (aic. on the CX; eic- and kic- in HaGeZi #11438); which countries LG files under
# each is inferred from the names and is unverified for every country but us.
[regions]
eic = [
  "gb", "ie", "de", "fr", "it", "es", "pt", "nl", "be", "lu", "at", "ch", "pl", "cz", "sk", "hu", "ro",
  "bg", "gr", "hr", "si", "rs", "dk", "se", "no", "fi", "ee", "lv", "lt", "ua", "tr", "il", "ae", "sa",
  "eg", "za", "ng", "ke", "ma",
]
kic = ["kr", "jp", "cn", "hk", "tw", "sg", "my", "th", "vn", "id", "ph", "in", "pk", "bd", "lk", "au", "nz"]
ruc = ["ru", "kz"]

# Blocklists `tvgw adguard apply` enables in AdGuard Home (the custom rules come from lg-webos.rules).
[adguard]
filters = [
  { name = "HaGeZi LG webOS", url = "https://adguardteam.github.io/HostlistsRegistry/assets/filter_72.txt" },
  { name = "HaGeZi DoH/VPN bypass (DoH only)", url = "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/doh.txt", role = "bypass" },
  { name = "HaGeZi Pro", url = "https://adguardteam.github.io/HostlistsRegistry/assets/filter_48.txt" },
]
# Record types the TV gets no answer for (one AdGuard rule scoped to the TV's address). HTTPS/SVCB
# records carry Encrypted ClientHello keys (which would hide every server name from the capture),
# address hints that skip the A lookup the gateway watches, and HTTP/3 hints the TV cannot use here
# (QUIC is rejected). Clients fall back to A records (RFC 9460). The CX has never asked for either
# type, so this is a guardrail for a firmware update or a newer set.
strip_qtypes = ["HTTPS", "SVCB"]

# LG's plain-HTTP file service carries app packages (keep) and the ACR config, telemetry schedule,
# LG Shopping data, promo thumbnails and LG Channels guide (block). Resolve these names to the
# gateway and let nginx apply block_regex to the request URI.
[url_filter]
hosts = ["ngfts.lge.com", "aic-ngfts.lge.com", "aic-img-ngfts.lge.com", "gfts.lge.com"]
block_regex = 'biz_code=(PREMIUM|CDP|LGSHOPPING|MAS|IBS)([&_]|$)'

# ---- Generations: the OS the TV runs -------------------------------------------------------------
# (W12, 2026-11-04) A generation is the webOS the TV RUNS, not the year it was sold: since LG's Re:New
# programme a 2022 set can run webOS 22, 23, 24, 25 or 26, and webOS 26 is rolling down to 2022 sets.
# `os_major` is what the TV reports in its SSAP `hello` reply as deviceOSReleaseVersion (5.6.2 on the
# CX, 7.5.7 on a webOS 22 set, 11.2.0 on webOS 26); LG's developer site maps 7.x = webOS 22, 8.x = 23,
# 9.x = 24, and the sets themselves show 10.x = 25 and 11.x = 26. The hourly reading picks the row by it;
# `models` are the lines that shipped with the release, kept for the docs' table. `firmware_majors` is
# informational: 03.x is webOS 6 and 22, 04.x webOS 5 and a webOS 22 LCD line, so only a major one row
# alone carries is `firmware_major`, the lookup key. From 2024 the major names the line: 23 = webOS 24,
# 33 = webOS 25, 43 = webOS 26, whatever the model year.
# `readable` lists the getSystemSettings keys of privacy interest in the PUBLIC read list of bscpylgtv's
# dumps from real sets (CX 5.6.1, C1 6.5.3, G3 9.2.2, G4 9.2.4, G5 10.2.0, G6 11.1.0, C2 11.2.0): a
# non-rooted TV answers only that list (REPORTED). The keys behind Limit AD Tracking (general.lmt), Do Not
# Sell, Screen Saver Promotion, Content Recommendation and watched-list collection exist on every set and
# are in no public list: they stay the owner's dated word (design decision 57).
# `menu` paths start at Settings > All Settings. `manifest` is the pairing manifest that works: the
# library's signed "LG Remote App" manifest, or tvgw's unsigned read-only one; LG refuses the signed
# one from webOS 26 firmware 43.20 and on some webOS 25 sets (aiowebostv #718, #720), with no prompt.
# `support` is tvgw's: only webOS 5 is tested (the CX). `confidence` grades the row as before: observed
# (this project), community (independent reports, dumps from real sets), spec (vendor pages), low.
# Sources read 2026-11-04 (docs/research: R2-lg-webos-versions.md names each with its grade).
[[generations]]
webos = "3"
os_major = "3"
release_range = "3.x"
years = [2016, 2017]
codename = "dreadlocks"
clock_hosts = ["<cc>.lgtvsdp.com"]
manifest = "signed"
support = "not-yet-tested"
notes = ["SDP initservices POST sets the clock from X-Server-Time; certificate not checked (wisq/lgtv-sdp)", "root: RootMyTV (patched 2022), GetMeNow (dead 2024)"]
confidence = "community"
sources = ["https://webostv.developer.lge.com/develop/specifications/web-api-and-web-engine", "https://github.com/wisq/lgtv-sdp"]

[[generations]]
webos = "4"
os_major = "4"
release_range = "4.x"
years = [2018, 2019]
codename = "goldilocks"
models = ["B8", "C8", "E8", "W8", "SK", "UK", "B9", "C9", "E9", "W9", "SM", "UM"]
firmware_majors = ["05"]
clock_hosts = ["<cc>.lgtvsdp.com"]
readable = ["eulaStatus", "eulaInfoNetwork", "option.livePlus"]  # presence only: the dumps' public lists were not read for 4.x
manifest = "signed"
support = "not-yet-tested"
notes = [
  "C9 runs webOS 4.10; blocking *.lgrecommends.lgappstv.com gives Content Store error 202 (C9)",
  "a C8 still answers ws on port 3000 (2026-10); tvgw uses wss 3001 on every generation",
  "C1/C3 sweep reverse DNS across the whole /24 at power-on even with Auto device detection off (also seen on webOS 6/8)",
]
confidence = "community"
sources = [
  "https://github.com/chros73/bscpylgtv/blob/master/docs/available_settings_C8.md",
  "https://www.lg.com/ca_en/support/product-help/CT20098005-20150814211607",
]
[generations.menu]
agreements = "General > User Agreements"

[[generations]]
webos = "5"
os_major = "5"
release_range = "5.x (this CX: 5.6.2 at firmware 04.64.00)"
years = [2020]
codename = "jhericurl"
models = ["BX", "CX", "GX", "WX", "ZX", "NANO", "UN"]
firmware_major = "04"  # unique as a lookup key among the rows that name one; a webOS 22 LCD line also uses 04.x (firmware_majors)
firmware_majors = ["04"]
verified = true
clock_hosts = ["us.lgtvsdp.com"]
readable = [
  "eulaStatus", "eulaInfoNetwork", "option.livePlus", "option.country", "option.storeMode", "option.audioGuidance",
  "network.bleAdvertisingOnOff", "network.wolwowlOnOff", "network.deviceName", "other.simplinkEnable",
]
consent_flags = [
  "acrAdAllowed", "acrAllowed", "acrGdprAllowed", "acrOnAllowed", "additional1Allowed", "additional2Allowed",
  "additional3Allowed", "additional4Allowed", "additional5Allowed", "additionalDataAllowed", "chpAllowed",
  "cookiesAllowed", "customAdAllowed", "customadsAllowed", "generalTermsAllowed", "marketingOnAllowed",
  "networkAllowed", "remoteDiagAllowed", "takeOnAllowed", "thirdPartySharingAllowed", "voice2Allowed", "voiceAllowed",
]
manifest = "signed"  # this CX's key, paired with the library's signed manifest, reads at 04.64.00 (observed)
support = "tested"
lan_api = "SSAP wss 3001; reads work; writes through the createAlert Luna bridge are refused on 04.64 ('isCallAllowed reply returnValue false') even with WRITE_NOTIFICATION_ALERT and WRITE_NOTIFICATION_TOAST in the manifest (re-tested 2026-10-27 with com.webos.service.wifi/deleteprofile): firmware-enforced, so settings and saved Wi-Fi networks can only be changed on the TV itself"
dns_bypass = ["tries 8.8.8.8 directly (DNAT'd here)"]
notes = [
  "not in Re:New: stays on webOS 5",
  "Google Assistant service ended for all LG TVs on 2025-05-01",
  "ws on port 3000 refused ('Connection reset by peer') at 04.64.00 (observed)",
  "the agreements path is LG's own help page's; the profile said Support > Privacy & Terms until 2026-11-04 (check on the CX)",
  "root: natxobsd/lg-webos5-root (beta 2026-10, GPU chain, one device tested)",
]
confidence = "observed"
sources = [
  "https://github.com/chros73/bscpylgtv/blob/master/docs/available_settings_CX.md",
  "https://www.lg.com/it/supporto/supporto-prodotto/risoluzione-anomalie/help-library/cs-CT52001071-20153387508381/",
]
[generations.menu]
wifi = "Connection > Network Connection Settings > Wi-Fi Connection"
agreements = "Support > Additional Settings > User Agreements"
live_plus = "General > Additional Settings > Live Plus"
advertising = "General > Additional Settings > Advertisement"
standby = "General > Additional Settings > Quick Start+; General > Mobile TV On (Turn on via Wi-Fi)"

[[generations]]
webos = "6"
os_major = "6"
release_range = "6.x (a C1: 6.5.3 at firmware 03.53.45)"
years = [2021]
codename = "kisscurl"
models = ["A1", "B1", "C1", "G1", "Z1", "QNED", "NANO", "UP"]
firmware_majors = ["03"]  # shared with webOS 22: never pick a row from 03.x alone
clock_hosts = ["<cc>.lgtvsdp.com", "<cc>.nextlgsdp.com"]
readable = [
  "eulaStatus", "eulaInfoNetwork", "option.livePlus", "option.country", "option.storeMode",
  "network.bleAdvertisingOnOff", "network.wolwowlOnOff", "general.alwaysOn", "other.ueiEnable", "other.simplinkEnable",
]
consent_flags = [
  "acrAdAllowed", "acrAllowed", "acrGdprAllowed", "acrOnAllowed", "additional1Allowed", "additional2Allowed",
  "additional3Allowed", "additional4Allowed", "additional5Allowed", "additionalDataAllowed", "chpAllowed",
  "cookiesAllowed", "customAdAllowed", "customadsAllowed", "generalTermsAllowed", "marketingOnAllowed",
  "networkAllowed", "remoteDiagAllowed", "shoppingOnAllowed", "takeOnAllowed", "thirdPartySharingAllowed",
  "veranceOnAllowed", "voice2Allowed", "voiceAllowed", "wasuOnAllowed",
]
manifest = "signed"  # no report of a refusal on webOS 6 (community); a new pairing uses the unsigned one either way
support = "not-yet-tested"
dns_bypass = ["none seen in a 40-minute EU capture (community)"]
notes = [
  "first generation on the nextlgsdp.com SDP backbone; keep both SDP families reachable",
  "not in Re:New: stays on webOS 6",
  "general.alwaysOn is readable here, but Always Ready itself is a 2022+ feature",
  "root: faultmanager (latest firmware patched 2025-08)",
]
confidence = "community"
sources = [
  "https://github.com/chros73/bscpylgtv/blob/master/docs/available_settings_C1.md",
  "https://www.lg.com/ae/support/product-help/CT20076005-20153529296767LST",
]
[generations.menu]
wifi = "General > Network > Wi-Fi Connection"
agreements = "Support > Privacy & Terms > User Agreements"
live_plus = "General > System > Additional Settings > Live Plus"
advertising = "General > System > Additional Settings > Advertisement"
standby = "General > Devices > TV Management > Quick Start+; General > Devices > External Devices > TV On With Mobile"

[[generations]]
webos = "22"
os_major = "7"
release_range = "7.x (a 2022 LCD: 7.5.7 at firmware 04.54.40)"
years = [2022]
codename = "mullet"
models = ["A2", "B2", "C2", "G2", "Z2", "QNED", "NANO", "UQ"]
firmware_majors = ["03", "04"]  # 03.x on the 2022 OLEDs, 04.x on a 2022 LCD line: both shared, neither a lookup key
clock_hosts = ["<cc>.nextlgsdp.com"]
readable = []  # no dump of a set still on webOS 22 was found: expect webOS 6's list (UNCERTAIN)
manifest = "signed"  # no report of a refusal on webOS 22 (community)
support = "not-yet-tested"
notes = [
