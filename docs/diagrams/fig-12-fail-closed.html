<style>
/* tvgw diagram system: tokens, components, connectors.
   One source for every figure. build.py inlines this file into each figure's <style data-inline>.
   Grid: every coordinate is a multiple of 8 px. Canvas: 960 CSS px wide, rendered at 2x.
   Themes: light by default, dark under prefers-color-scheme, and either forced with
   html[data-theme="light" | "dark"] (the figures set it from #light / #dark in the URL). */

@import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=block");

:root {
  color-scheme: light;

  /* Type. Hierarchy comes from weight and ink, not from many sizes. */
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --fs-title: 16px;   /* node titles */
  --fs-label: 15px;   /* connector labels */
  --fs-sub: 13px;     /* secondary lines */
  --fs-meta: 12px;    /* mono identifiers, legend */
  --lh-title: 22px;
  --lh-label: 20px;
  --lh-sub: 18px;

  /* 8-pt spacing */
  --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px; --s5: 40px; --s6: 48px;
  --r-card: 10px;
  --r-tag: 6px;

  /* Neutrals, cool and slightly blue-grey. Stage matches GitHub's page so the PNG sits flush. */
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f6f7f9;
  --surface-3: #eef0f3;
  --border: #e3e6eb;
  --border-strong: #cfd4dc;
  --ink: #101828;
  --ink-2: #4a5466;
  --ink-3: #7b8494;

  /* The one accent: cobalt. It marks the path a figure is about, nothing else. */
  --accent: #2e56d6;
  --accent-ink: #2346b5;
  --accent-wash: #eef2fd;
  --accent-edge: #c9d5f7;

  /* Role tints: low-chroma washes with a readable ink. Never fills of pure hue. */
  --gate-wash: var(--accent-wash);   --gate-ink: var(--accent-ink);   --gate-edge: var(--accent-edge);
  --obs-wash: #edf4f0;               --obs-ink: #3b6a51;              --obs-edge: #cfe0d6;
  --judge-wash: #f7f1e4;             --judge-ink: #835f17;            --judge-edge: #e6d8b8;
  --world-wash: #f2f3f5;             --world-ink: #505b6c;            --world-edge: #dde1e7;
  --stop: #b2463a;                   --stop-wash: #fbeeec;

  /* Connectors */
  --wire: #a3abb8;
  --wire-strong: #697386;
  --wire-w: 1.5px;
  --wire-accent-w: 2.5px;

  --shadow: 0 1px 1px rgba(16, 24, 40, 0.04), 0 2px 6px rgba(16, 24, 40, 0.05), 0 8px 24px -8px rgba(16, 24, 40, 0.08);

  /* Illustration palette. Light from the top left. */
  --art-shadow: rgba(16, 24, 40, 0.14);
  --tv-frame: #1d2027;
  --tv-edge: #4b515c;
  --tv-sky-top: #0f1830;
  --tv-sky-bottom: #2d4a86;
  --tv-hill-far: #1a2745;
  --tv-hill-near: #0d1426;
  --tv-sheen: rgba(255, 255, 255, 0.07);
  --stand-top: #c7ccd3;
  --stand-face: #8d939c;
  --stand-face-2: #6c727b;
  --pcb: #2f7752;
  --pcb-2: #276645;
  --pcb-edge: #1e5237;
  --silk: rgba(255, 255, 255, 0.55);
  --metal: #d5d9df;
  --metal-2: #aab1bb;
  --metal-3: #8a929d;
  --chip: #23262c;
  --chip-2: #34383f;
  --gold: #d8b25a;
  --usb3: #3b6fd8;
  --plastic: #f1f2f4;
  --plastic-2: #d9dce1;
  --plastic-3: #b9bec6;
  --led: #3fa46a;
  --screen: #141a24;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d1117;
    --surface: #151b24;
    --surface-2: #1a212b;
    --surface-3: #212935;
    --border: #2a3340;
    --border-strong: #3a4554;
    --ink: #e8ecf2;
    --ink-2: #a2adbd;
    --ink-3: #727e8f;
    --accent: #7d9cff;
    --accent-ink: #a9bcff;
    --accent-wash: #18213a;
    --accent-edge: #2f3f6e;
    --obs-wash: #15231c;    --obs-ink: #97c7ab;   --obs-edge: #284535;
    --judge-wash: #2a2416;  --judge-ink: #e0bf78; --judge-edge: #4a3f22;
    --world-wash: #1a212b;  --world-ink: #b0b9c7; --world-edge: #2f3845;
    --stop: #ec8577;        --stop-wash: #2d1a18;
    --wire: #4a5565;
    --wire-strong: #8c97a8;
    --shadow: 0 0 0 1px rgba(255, 255, 255, 0.02), 0 8px 24px -8px rgba(0, 0, 0, 0.6);
    --art-shadow: rgba(0, 0, 0, 0.45);
    --tv-frame: #262a32;
    --tv-edge: #5a616d;
    --stand-top: #9aa1ab;
    --stand-face: #6a717b;
    --stand-face-2: #4f555e;
    --pcb: #2b6b4a;
    --pcb-2: #245c3f;
    --pcb-edge: #1a4630;
    --silk: rgba(255, 255, 255, 0.45);
    --metal: #b9bfc8;
    --metal-2: #8f97a2;
    --metal-3: #6f7782;
    --plastic: #3a414c;
    --plastic-2: #2c323b;
    --plastic-3: #232830;
    --screen: #0b0f16;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d1117;
  --surface: #151b24;
  --surface-2: #1a212b;
  --surface-3: #212935;
  --border: #2a3340;
  --border-strong: #3a4554;
  --ink: #e8ecf2;
  --ink-2: #a2adbd;
  --ink-3: #727e8f;
  --accent: #7d9cff;
  --accent-ink: #a9bcff;
  --accent-wash: #18213a;
  --accent-edge: #2f3f6e;
  --obs-wash: #15231c;    --obs-ink: #97c7ab;   --obs-edge: #284535;
  --judge-wash: #2a2416;  --judge-ink: #e0bf78; --judge-edge: #4a3f22;
  --world-wash: #1a212b;  --world-ink: #b0b9c7; --world-edge: #2f3845;
  --stop: #ec8577;        --stop-wash: #2d1a18;
  --wire: #4a5565;
  --wire-strong: #8c97a8;
  --shadow: 0 0 0 1px rgba(255, 255, 255, 0.02), 0 8px 24px -8px rgba(0, 0, 0, 0.6);
  --art-shadow: rgba(0, 0, 0, 0.45);
  --tv-frame: #262a32;
  --tv-edge: #5a616d;
  --stand-top: #9aa1ab;
  --stand-face: #6a717b;
  --stand-face-2: #4f555e;
  --pcb: #2b6b4a;
  --pcb-2: #245c3f;
  --pcb-edge: #1a4630;
  --silk: rgba(255, 255, 255, 0.45);
  --metal: #b9bfc8;
  --metal-2: #8f97a2;
  --metal-3: #6f7782;
  --plastic: #3a414c;
  --plastic-2: #2c323b;
  --plastic-3: #232830;
  --screen: #0b0f16;
}

/* ---------- Page and figure ---------- */

.dg-page {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.dg-page.render { overflow: hidden; }
.dg-page.render .fig-caption { display: none; }

.fig { margin: 0; font-family: var(--font-sans); color: var(--ink); }

/* The stage is the fixed canvas. Children are placed with left/top on the 8 px grid. */
.stage {
  position: relative;
  background: var(--bg);
  overflow: hidden;
}
.stage > * { position: absolute; box-sizing: border-box; }
.stage > .art { z-index: 0; }
.stage > .wires { z-index: 1; }
.stage > .card, .stage > .tbl, .stage > .brief, .stage > .rail, .stage > .rule-row, .stage > .tl-bar, .stage > .tl-tick, .stage > .start-dot, .stage > .wire-label, .stage > .art-caption, .stage > .legend, .stage > .note { z-index: 2; }
.stage .wires { inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }

.fig-caption {
  max-width: 720px;
  margin: var(--s2) 0 0;
  font-size: 15px;
  line-height: 24px;
  color: var(--ink-2);
}
.fig-caption b { color: var(--ink); font-weight: 600; }
.fig-caption code { font: 400 0.9em var(--font-mono); color: var(--ink); }

/* ---------- Region: a group drawn as a quiet tinted field, never a box inside a box ---------- */

.region {
  border-radius: 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
}
.region.gate { background: color-mix(in srgb, var(--gate-wash) 60%, var(--bg)); border-color: var(--gate-edge); }
.region.judge { background: color-mix(in srgb, var(--judge-wash) 55%, var(--bg)); border-color: var(--judge-edge); }
.region.world { background: var(--surface-2); border-color: var(--border); border-style: dashed; }
.region-title {
  font: 600 var(--fs-meta)/16px var(--font-sans);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.region-title.gate { color: var(--gate-ink); }
.region-title.judge { color: var(--judge-ink); }

/* ---------- Card (a node) ---------- */

.card {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 16px 14px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-card);
  box-shadow: var(--shadow);
}
.card.center { align-items: center; }
.card.stack { flex-direction: column; gap: 0; }
.card.stack .head { display: flex; gap: 12px; align-items: center; }
.card.plain { padding: 12px 16px; }
.card .glyph {
  flex: none;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  background: var(--surface-3);
  color: var(--ink-2);
}
.card .glyph svg { width: 18px; height: 18px; }
.card .body { min-width: 0; }
.card .title { font: 600 var(--fs-title)/var(--lh-title) var(--font-sans); color: var(--ink); letter-spacing: -0.005em; }
.card .sub { font: 400 var(--fs-sub)/var(--lh-sub) var(--font-sans); color: var(--ink-2); margin-top: 2px; }
.card .id { font: 500 var(--fs-meta)/16px var(--font-mono); color: var(--ink-3); margin-top: 4px; }

/* Roles colour only the glyph tile and one edge; the card body stays neutral. */
.card.gate .glyph { background: var(--gate-wash); color: var(--gate-ink); }
.card.obs .glyph { background: var(--obs-wash); color: var(--obs-ink); }
.card.judge .glyph { background: var(--judge-wash); color: var(--judge-ink); }
.card.world .glyph { background: var(--world-wash); color: var(--world-ink); }
.card.focus { border-color: var(--accent-edge); box-shadow: var(--shadow), 0 0 0 3px color-mix(in srgb, var(--accent) 10%, transparent); }
.card.flat { box-shadow: none; background: var(--surface-2); }
.card.ghost { box-shadow: none; background: transparent; border-style: dashed; }

/* A pipeline stage: a step number before the title, and what it drops in brick */
.card.stage-card { flex-direction: column; gap: 0; padding: 12px 14px; }
.card.stage-card .title { display: flex; align-items: center; gap: 8px; }
.card.stage-card .title .step { margin: 0; flex: none; }
.card.stage-card .id { margin-top: 2px; }
.card .drop { font: 400 var(--fs-sub)/18px var(--font-sans); color: var(--stop); margin-top: 6px; }
.card .pass { font: 400 var(--fs-sub)/18px var(--font-sans); color: var(--ink-2); margin-top: 6px; }
.card .tag-right { margin-left: auto; align-self: flex-start; }

/* State machine: a state is a card with a status dot; a start is a filled dot */
.card.state { align-items: center; gap: 12px; padding: 12px 16px; }
.card.state .sdot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--wire-strong); box-shadow: 0 0 0 4px var(--surface-3); }
.card.state .sdot.accent { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-wash); }
.card.state .sdot.obs { background: var(--obs-ink); box-shadow: 0 0 0 4px var(--obs-wash); }
.card.state .sdot.stop { background: var(--stop); box-shadow: 0 0 0 4px var(--stop-wash); }
.start-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--ink); }

/* Timeline: bars on a time axis, ticks below */
.tl-axis { height: 0; border-top: 1px solid var(--border-strong); }
.tl-tick { font: 500 var(--fs-meta)/16px var(--font-mono); color: var(--ink-3); transform: translateX(-50%); white-space: nowrap; }
.tl-tick::before { content: ""; position: absolute; left: 50%; top: -12px; height: 8px; border-left: 1px solid var(--border-strong); }
.tl-bar { height: 28px; border-radius: 6px; display: flex; align-items: center; padding: 0 10px; font: 500 var(--fs-sub)/1 var(--font-sans); white-space: nowrap; background: var(--surface-3); color: var(--ink-2); }
.tl-bar.accent { background: var(--accent-wash); color: var(--accent-ink); box-shadow: inset 3px 0 0 var(--accent); }
.tl-bar.judge { background: var(--judge-wash); color: var(--judge-ink); box-shadow: inset 3px 0 0 var(--judge-ink); }
.tl-bar.ink { background: var(--surface-3); color: var(--ink); box-shadow: inset 3px 0 0 var(--ink); }
.tl-bar.dashed { background: repeating-linear-gradient(90deg, var(--accent-wash) 0 6px, transparent 6px 10px); box-shadow: none; }
.tl-note { font: 400 var(--fs-sub)/18px var(--font-sans); color: var(--ink-3); }

/* Table-relation: a store table as a card of column rows; a wire can land on a row (data-id on .col) */
.tbl { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow); overflow: hidden; }
.tbl .th { display: flex; align-items: center; gap: 8px; padding: 10px 12px; font: 600 15px/20px var(--font-mono); color: var(--ink); border-bottom: 1px solid var(--border); background: var(--surface-2); }
.tbl .th .tag { margin-left: auto; }
.tbl .col { display: flex; justify-content: space-between; gap: 8px; padding: 0 12px; font: 400 13px/24px var(--font-mono); color: var(--ink-2); }
.tbl .col.k { color: var(--ink); font-weight: 500; }
.tbl .col.join { color: var(--accent-ink); background: color-mix(in srgb, var(--accent-wash) 70%, transparent); }
.tbl .col i { font-style: normal; color: var(--ink-3); font-size: 12px; }
.tbl .cols { padding: 4px 0 6px; }
.tbl.ref { box-shadow: none; background: var(--surface-2); }
.tbl.ref .th { background: transparent; color: var(--ink-2); }
.wire-label .join { font: 400 13px/18px var(--font-mono); color: var(--ink-2); display: block; }

/* An ordered list inside a card: step badge, a line, its source in mono below */
.genlist { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
.genlist > div { display: flex; gap: 10px; align-items: flex-start; font: 400 var(--fs-sub)/18px var(--font-sans); color: var(--ink); }
.genlist .step { margin: 0; flex: none; }
.genlist b { font: 500 13px/18px var(--font-mono); }
.genlist i { display: block; font: 400 12px/16px var(--font-mono); font-style: normal; color: var(--ink-3); }

/* A list of short facts inside a card */
.facts { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px solid var(--border); list-style: none; }
.facts li { font: 400 var(--fs-sub)/20px var(--font-sans); color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
.facts li::before { content: ""; width: 6px; height: 6px; border-radius: 1px; background: var(--stop); opacity: 0.85; flex: none; }

/* A row of refused things, inside a card */
.drops { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; padding-left: 24px; border-left: 1px solid var(--border); }
.drops-label { font: 500 var(--fs-sub)/22px var(--font-sans); color: var(--ink-3); margin-right: 4px; }

/* Lists of tags inside a tall card: the store's tables, the machine's rules by state */
.tablelist { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }
.list-title { font: 600 var(--fs-meta)/16px var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }

/* A state row placed on the stage over a tall card, centred on an incoming wire; .rail joins the rows */
.rule-row { display: flex; align-items: center; gap: 8px; height: 22px; }
.rule-row .sub { font: 400 var(--fs-sub)/18px var(--font-sans); color: var(--ink-2); }
.rail { width: 0; border-left: 1.5px dashed var(--wire); }

/* Tags: small status markers ("probation", "daily") */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 22px;
  padding: 0 8px;
  border-radius: var(--r-tag);
  font: 500 var(--fs-meta)/1 var(--font-sans);
  color: var(--ink-2);
  background: var(--surface-3);
  white-space: nowrap;
}
.tag.accent { color: var(--accent-ink); background: var(--accent-wash); }
.tag.judge { color: var(--judge-ink); background: var(--judge-wash); }
.tag.obs { color: var(--obs-ink); background: var(--obs-wash); }
.tag.stop { color: var(--stop); background: var(--stop-wash); }
.tag.mono { font-family: var(--font-mono); font-weight: 400; }

/* A printout of `tvgw brief`: mono rows, then placeholder bars */
.brief { padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow); }
.brief .row { display: flex; justify-content: space-between; gap: 12px; font: 400 12px/20px var(--font-mono); color: var(--ink-2); }
.brief .row b { font-weight: 500; color: var(--ink); }
.brief .ok { color: var(--obs-ink); }
.brief .bar { height: 6px; margin-top: 7px; border-radius: 3px; background: var(--surface-3); }

/* ---------- Illustration nodes ---------- */

.art { display: block; overflow: visible; }
.art-caption { text-align: center; }
.art-caption .title { font: 600 var(--fs-title)/var(--lh-title) var(--font-sans); color: var(--ink); }
.art-caption .sub { font: 400 var(--fs-sub)/var(--lh-sub) var(--font-sans); color: var(--ink-2); margin-top: 2px; }
.art-caption.left { text-align: left; }

/* ---------- Connectors ---------- */
/* Declared as <div class="wire" data-from="a@r" data-to="b@l">label</div>; wires.js draws them. */

.wires path.w { fill: none; stroke: var(--wire); stroke-width: var(--wire-w); stroke-linecap: round; stroke-linejoin: round; }
.wires path.w.accent { stroke: var(--accent); stroke-width: var(--wire-accent-w); }
.wires path.w.strong { stroke: var(--wire-strong); }
.wires path.w.dashed { stroke-dasharray: 2 5; }
.wires path.w.stop { stroke: var(--stop); stroke-dasharray: 5 5; stroke-linecap: butt; }
.wires .head { fill: var(--wire); }
.wires .head.accent { fill: var(--accent); }
.wires .head.strong { fill: var(--wire-strong); }
.wires .head.stop { fill: none; stroke: var(--stop); stroke-width: 2.5px; stroke-linecap: round; }
.wires .dot { fill: var(--bg); stroke: var(--wire); stroke-width: 1.5px; }
.wires .dot.accent { stroke: var(--accent); stroke-width: 2px; }
.wires .dot.strong { stroke: var(--wire-strong); }

.wire { white-space: nowrap; }
.wire-label {
  position: absolute;
  font: 500 var(--fs-label)/var(--lh-label) var(--font-sans);
  color: var(--ink);
  letter-spacing: -0.003em;
  white-space: nowrap;
}
.wire-label .sub { display: block; font: 400 var(--fs-sub)/var(--lh-sub) var(--font-sans); color: var(--ink-2); letter-spacing: 0; }
.wire-label.on { background: var(--bg); padding: 2px 8px; border-radius: var(--r-tag); }
.wire-label.accent { color: var(--accent-ink); }
.wire-label.stop { color: var(--stop); }
.wire-label.center { text-align: center; }
.wire-label.right { text-align: right; }
.wire-label .mono { font: 400 13px/18px var(--font-mono); color: var(--ink-2); }
.wire-label .ico { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; }

/* A numbered step marker, for figures that read in order */
.step {
  display: inline-grid;
  place-items: center;
  width: 20px;
  height: 20px;
  margin-right: 8px;
  border-radius: 50%;
  font: 600 12px/1 var(--font-sans);
  color: var(--bg);
  background: var(--ink);
  vertical-align: 1px;
}
.step.accent { background: var(--accent); }

/* ---------- Legend ---------- */

.legend { display: flex; flex-direction: column; gap: 8px; }
.legend-row { display: flex; align-items: center; gap: 12px; font: 400 var(--fs-sub)/var(--lh-sub) var(--font-sans); color: var(--ink-2); }
.legend-row svg { flex: none; width: 40px; height: 12px; overflow: visible; }
.legend-row .k { stroke: var(--wire); stroke-width: 1.5px; fill: none; }
.legend-row .k.accent { stroke: var(--accent); stroke-width: 2.5px; }
.legend-row .k.stop { stroke: var(--stop); stroke-dasharray: 5 5; }
.legend-row .kh { fill: var(--wire); }
.legend-row .kh.accent { fill: var(--accent); }
.legend-row .kb { stroke: var(--stop); stroke-width: 2.5px; stroke-linecap: round; }

/* ---------- Icons (Lucide, ISC) ---------- */
.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
</style>
<!-- /inline:diagram.css -->
</head>

<!-- inline:wires.js -->
<script>
/* tvgw diagram connectors. No dependencies. build.py inlines this file into each figure.

   Markup, inside a .stage:
     <div class="wire accent" data-from="tv@r" data-to="pi@l:-24" data-label-at="above">
       every packet<span class="sub">secondary line</span>
     </div>

   data-from / data-to   "<data-id>@<side>[:<offset>]". side is t, r, b or l; offset moves the point
                         along that side in px from its middle (positive is right or down).
                         "@<x>,<y>" is a bare point in stage px.
   data-via              "x,y x,y": corner points for a route the default cannot express.
   data-align="from"     end on the start's line (a straight wire into a taller or wider node).
   data-mid              x (horizontal-horizontal) or y (vertical-vertical) of the middle leg.
   data-draw="none"      draw nothing, only place the label: a second label for the same route.
   data-start            "dot" draws an origin dot. data-end: "arrow" (default), "none", "stop", "dot".
   data-label-seg        which straight segment holds the label (default: the longest).
   data-label-t          where along it, 0..1 (default 0.5).
   data-label-at         "on" (knocked out of the line, default), "above", "below", "left", "right".
   data-label-dx/-dy     nudges in px.
   Classes on .wire      accent | strong | dashed | stop (stroke style), and are copied to the label.
   Every number is in stage px; keep them on the 8 px grid. */
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var RADIUS = 12, HEAD_L = 9, HEAD_W = 4.75, GAP = 8;

  function box(stage, el) {
    var s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
    return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height };
  }

  function point(stage, spec) {
    var at = spec.split("@");
    if (at[0] === "") {
      var xy = at[1].split(",");
      return { x: +xy[0], y: +xy[1], side: null };
    }
    var el = stage.querySelector('[data-id="' + at[0] + '"]');
    if (!el) throw new Error("wires: no element with data-id=" + at[0]);
    var b = box(stage, el);
    var parts = (at[1] || "r").split(":"), side = parts[0], off = +(parts[1] || 0);
    if (side === "t") return { x: b.x + b.w / 2 + off, y: b.y, side: side };
    if (side === "b") return { x: b.x + b.w / 2 + off, y: b.y + b.h, side: side };
    if (side === "l") return { x: b.x, y: b.y + b.h / 2 + off, side: side };
    return { x: b.x + b.w, y: b.y + b.h / 2 + off, side: "r" };
  }

  var horiz = function (s) { return s === "l" || s === "r"; };

  function route(a, b, w) {
    if (w.dataset.via) {
      var via = w.dataset.via.trim().split(/\s+/).map(function (p) {
        var xy = p.split(","); return { x: +xy[0], y: +xy[1] };
      });
      return [a].concat(via, [b]);
    }
    var mid = w.dataset.mid;
    /* data-align="from": keep the route straight by moving the end onto the start's line. */
    if (w.dataset.align === "from") { if (horiz(a.side)) b.y = a.y; else b.x = a.x; }
    if (horiz(a.side) && horiz(b.side)) {
      if (Math.abs(a.y - b.y) < 0.5) return [a, { x: b.x, y: a.y }];
      var mx = mid !== undefined ? +mid : (a.x + b.x) / 2;
      return [a, { x: mx, y: a.y }, { x: mx, y: b.y }, b];
    }
    if (!horiz(a.side) && !horiz(b.side)) {
      if (Math.abs(a.x - b.x) < 0.5) return [a, { x: a.x, y: b.y }];
      var my = mid !== undefined ? +mid : (a.y + b.y) / 2;
      return [a, { x: a.x, y: my }, { x: b.x, y: my }, b];
    }
    if (horiz(a.side)) return [a, { x: b.x, y: a.y }, b];
    return [a, { x: a.x, y: b.y }, b];
  }

  function dir(p, q) {
    var dx = q.x - p.x, dy = q.y - p.y, l = Math.hypot(dx, dy) || 1;
    return { x: dx / l, y: dy / l, l: l };
  }

  /* Polyline to a path with rounded corners. */
  function pathD(pts) {
    var d = "M" + pts[0].x + " " + pts[0].y;
    for (var i = 1; i < pts.length - 1; i++) {
      var p = pts[i - 1], c = pts[i], n = pts[i + 1];
      var d1 = dir(p, c), d2 = dir(c, n);
      var r = Math.min(RADIUS, d1.l / 2, d2.l / 2);
      d += " L" + (c.x - d1.x * r) + " " + (c.y - d1.y * r);
      d += " Q" + c.x + " " + c.y + " " + (c.x + d2.x * r) + " " + (c.y + d2.y * r);
    }
    var last = pts[pts.length - 1];
    return d + " L" + last.x + " " + last.y;
  }

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }

  function draw(stage) {
    var svg = stage.querySelector(":scope > svg.wires");
    if (!svg) {
      svg = document.createElementNS(NS, "svg");
      svg.setAttribute("class", "wires");
      svg.setAttribute("aria-hidden", "true");
      stage.insertBefore(svg, stage.firstChild);
    }
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    stage.querySelectorAll(".wire").forEach(function (w) {
      var kinds = ["accent", "strong", "dashed", "stop"].filter(function (k) { return w.classList.contains(k); });
      var cls = kinds.join(" ");
      var a = point(stage, w.dataset.from), b = point(stage, w.dataset.to);
      /* A bare point takes the side facing the other end. */
      var across = Math.abs(b.x - a.x) >= Math.abs(b.y - a.y);
      if (!a.side) a.side = across ? (b.x > a.x ? "r" : "l") : (b.y > a.y ? "b" : "t");
      if (!b.side) b.side = across ? (b.x > a.x ? "l" : "r") : (b.y > a.y ? "t" : "b");
      var pts = route(a, b, w).filter(function (p, i, all) {
        return i === 0 || Math.abs(p.x - all[i - 1].x) > 0.5 || Math.abs(p.y - all[i - 1].y) > 0.5;
      });
      var end = w.dataset.end || (w.classList.contains("stop") ? "stop" : "arrow");

      /* Shorten the last leg so the arrowhead's tip lands exactly on the target edge. */
      var tail = dir(pts[pts.length - 2], pts[pts.length - 1]);
      var tip = pts[pts.length - 1];
      var drawn = pts.slice();
      if (end === "arrow") drawn[drawn.length - 1] = { x: tip.x - tail.x * (HEAD_L - 1), y: tip.y - tail.y * (HEAD_L - 1) };
      if (end === "stop") drawn[drawn.length - 1] = { x: tip.x - tail.x * GAP, y: tip.y - tail.y * GAP };
      var ghost = w.dataset.draw === "none";
      if (!ghost) el("path", { d: pathD(drawn), class: "w " + cls }, svg);

      if (ghost) { /* a second label on a wire drawn by another .wire */ }
      else if (end === "arrow") {
        var bx = tip.x - tail.x * HEAD_L, by = tip.y - tail.y * HEAD_L;
        el("path", {
          d: "M" + tip.x + " " + tip.y + " L" + (bx - tail.y * HEAD_W) + " " + (by + tail.x * HEAD_W) +
             " L" + (bx + tail.y * HEAD_W) + " " + (by - tail.x * HEAD_W) + " Z",
          class: "head " + cls
        }, svg);
      } else if (end === "stop") {
        var sx = tip.x - tail.x * GAP, sy = tip.y - tail.y * GAP;
        el("path", {
          d: "M" + (sx - tail.y * 8) + " " + (sy + tail.x * 8) + " L" + (sx + tail.y * 8) + " " + (sy - tail.x * 8),
          class: "head stop"
        }, svg);
      }
      if (end === "dot") {
        el("circle", { cx: tip.x, cy: tip.y, r: 3.5, class: "dot " + cls }, svg);
      }
      if (w.dataset.start === "dot") {
        el("circle", { cx: a.x, cy: a.y, r: 3.5, class: "dot " + cls }, svg);
      }

      /* The label */
      var label = w.querySelector(".wire-label");
      if (!label && w.childNodes.length) {
        label = document.createElement("div");
        label.className = "wire-label";
        while (w.firstChild) label.appendChild(w.firstChild);
        stage.appendChild(label);
        w._label = label;
      }
      label = w._label || label;
      if (!label) return;
      kinds.forEach(function (k) { if (k === "accent" || k === "stop") label.classList.add(k); });

      var segs = [];
      for (var i = 0; i < pts.length - 1; i++) segs.push({ p: pts[i], q: pts[i + 1], l: dir(pts[i], pts[i + 1]).l });
      var si = w.dataset.labelSeg !== undefined ? +w.dataset.labelSeg : segs.reduce(function (m, s, i) { return s.l > segs[m].l ? i : m; }, 0);
      var seg = segs[Math.min(si, segs.length - 1)];
      var t = w.dataset.labelT !== undefined ? +w.dataset.labelT : 0.5;
      var cx = seg.p.x + (seg.q.x - seg.p.x) * t, cy = seg.p.y + (seg.q.y - seg.p.y) * t;
      var at = w.dataset.labelAt || "on";
      label.classList.add(at === "on" ? "on" : "off");
      if (at === "on" || at === "above" || at === "below") label.classList.add(label.classList.contains("right") ? "right" : "center");
      var lw = label.offsetWidth, lh = label.offsetHeight, x, y;
      if (at === "on") { x = cx - lw / 2; y = cy - lh / 2; }
      else if (at === "above") { x = cx - lw / 2; y = cy - lh - 8; }
      else if (at === "below") { x = cx - lw / 2; y = cy + 8; }
      else if (at === "left") { x = cx - lw - 12; y = cy - lh / 2; }
      else { x = cx + 12; y = cy - lh / 2; }
      x += +(w.dataset.labelDx || 0); y += +(w.dataset.labelDy || 0);
      label.style.left = Math.round(x) + "px";
      label.style.top = Math.round(y) + "px";
    });
  }

  function drawAll() { document.querySelectorAll(".stage").forEach(draw); document.documentElement.dataset.wired = "1"; }

  /* Theme from the URL: #dark or #light forces it; #render hides captions for the PNG. */
  var h = location.hash;
  if (/dark/.test(h)) document.documentElement.dataset.theme = "dark";
  if (/light/.test(h)) document.documentElement.dataset.theme = "light";
  if (/render/.test(h)) document.addEventListener("DOMContentLoaded", function () { document.body.classList.add("render"); });

  var go = function () { (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(drawAll); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go); else go();
  window.tvgwWires = { draw: draw, drawAll: drawAll };
})();
</script>
