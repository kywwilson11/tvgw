name: ci

on:
  push:
    branches: [main]
    # a push to main deploys to the live gateway (the hardware job); no Markdown, and nothing of the
    # docs site (mkdocs.yml, docs/site/), is ever installed, and a deploy for docs alone would still
    # bounce nginx, dnsmasq and the firewall counters. (deploy window) tools/wait_deploy_window.py holds
    # this list as PATHS_IGNORE, to know a push that has no run: change the two together
    paths-ignore: ["**/*.md", "docs/**", "mkdocs.yml"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # mutation testing, weekly (Monday 06:17 UTC)
    # (deploy window) the deferred deploy's backstop, every 30 minutes: the hardware job alone, which goes
    # on only while a deploy waits for the gateway's quiet window (design decision 63). The run that
    # deferred waits for the window on the gateway itself; this schedule takes the wait up after a wait
    # that was lost, whenever GitHub starts it, and that is not often: four runs in 21 hours on
    # 2026-11-04 and 05, none inside the window. At :13 and :43, not :00 and :30: GitHub delays and
    # drops scheduled runs most at the top and the half of the hour, and the first day's at */30 never ran
    - cron: "13,43 * * * *"

# every job reads the repository and nothing else; a job that needs more says so on the job, with the reason
permissions:
  contents: read

# no workflow-level concurrency: a cancel there would also kill an in-progress deploy on the Pi
jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # a newer push on the same ref replaces an older unit run; the matrix values keep the three jobs of
    # one run out of each other's group
    concurrency:
      group: test-${{ github.ref }}-${{ matrix.python }}-${{ matrix.tz }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"] # 3.11: the floor (Debian 12); 3.13: the gateway's Debian 13 interpreter
        tz: ["UTC"]
        # the suite once more in a zone with daylight saving and a day boundary hours away from UTC, as a
        # gateway runs: the brief's days, the quiet window and the hourly buckets are local-time code, and
        # a test that passes only in UTC is how such a bug hides (this replaced a second local `make gate`)
        include:
          - python: "3.13"
            tz: "America/Chicago"
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; the token must not stay in .git/config on the runner
          # (deploy window) the whole history: make gate compares a pull request's commits with origin/main
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: make gate

  deb-build:
    # (packaging) a pull request that changes what the .deb is built from builds it, for amd64 on
    # GitHub's runner, and keeps nothing: release.yml builds the package only for a tag, so a file
    # nfpm.yaml copies that a change moved or broke showed up only at the next release
    # (docs/project/packaging.md). Nothing is uploaded, and nothing here reaches the gateway
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # a newer push to the pull request replaces an older build
    concurrency:
      group: deb-build-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash # bash --noprofile --norc -eo pipefail
    env:
      # release.yml's nfpm, the same version and hash (tests/unit/test_packaging.py holds them equal)
      NFPM_VERSION: "2.48.0"
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; the token must not stay in .git/config on the runner
          fetch-depth: 0 # the pull request's base commit, to compare with
      - name: does the pull request change what the package is built from?
        id: touched
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # the folders build-deb.sh packages, pyproject.toml, this workflow, and every file of the
          # checkout nfpm.yaml copies by name (its docs page and the licence) as this checkout's
          # nfpm.yaml names them; build/ is what build-deb.sh stages
          copied=$(sed -n 's|^[[:space:]]*-[[:space:]]*src:[[:space:]]*\./||p' packaging/nfpm.yaml | grep -v '^build/' || true)
          build=no
          # --no-renames lists a moved file under its old path too: a page moved away from the path
          # nfpm.yaml names is built, and fails; core.quotePath=false writes a name outside ASCII as
          # it is, not in quotes that no pattern below would match
          if ! changed=$(git -c core.quotePath=false diff --no-renames --name-only "$BASE" HEAD); then
            echo "the pull request's base commit cannot be read here: the package is built"
            build=yes
          fi
          while IFS= read -r path; do
            case $path in
              "") ;;
              packaging/* | deploy/* | src/* | pyproject.toml | .github/workflows/ci.yml) build=yes ;;
              *) if grep -qxF -- "$path" <<<"$copied"; then build=yes; fi ;;
            esac
          done <<<"$changed"
          echo "the package is built: $build"
          echo "build=$build" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.touched.outputs.build == 'yes'
        with:
          python-version: "3.13"
      - name: install nfpm, pinned and checked by hash
        if: steps.touched.outputs.build == 'yes'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"
      - name: build the amd64 .deb and list it; nothing is kept
        if: steps.touched.outputs.build == 'yes'
        env:
          TVGW_ARCH: amd64
        run: |
          packaging/build-deb.sh dist
          dpkg-deb --info dist/tvgw_*_amd64.deb
          dpkg-deb --contents dist/tvgw_*_amd64.deb

  hardware:
    # runs on the gateway itself (self-hosted runner on the Pi, labels: self-hosted, tvgw):
    # deploys this checkout and runs the hardware suite against the live firewall/resolver/store
    needs: test
    # a push to main of this repository whose unit tests passed, or the 30-minute schedule that takes up
    # a deferred deploy's wait (a schedule runs only on the default branch, from its copy of this file);
    # never a fork, a pull request or a dispatch (docs/project/supply-chain.md). !cancelled() because the
    # scheduled run has no test job, and a job whose needs were skipped is otherwise skipped too
    if: >-
      !cancelled()
      && github.repository == 'kywwilson11/tvgw'
      && github.ref == 'refs/heads/main'
      && ((github.event_name == 'push' && needs.test.result == 'success')
      || (github.event_name == 'schedule' && github.event.schedule == '13,43 * * * *'))
    runs-on: [self-hosted, tvgw]
    # install.sh is a linear `set -e` script with no rollback: a deploy is never cancelled by a newer
    # push (it queues) and never times out mid-install. Worst case inside the deploy step: install.sh
    # blocks on the first analyze run (TimeoutStartSec=45min), then the suite runs ingest twice (900 s
    # each); that step's own 90 minutes are the guard.
    # (deploy window) The scheduled run queues in a group of its own: a run waiting in a group replaces
    # the one that waited before it, and a scheduled run must never take the place of a push waiting to
    # deploy. The job's 24 hours, the life of its token, hold the wait for the quiet window (the wait
    # step's 1345 minutes) and the deploy after it
    concurrency:
      group: ${{ github.event_name == 'schedule' && 'deploy-tvgw-retry' || 'deploy-tvgw' }}
      cancel-in-progress: false
    timeout-minutes: 1440
    defaults:
      run:
        # (deploy window) every step pipes all it prints through the checkout's scrubber
        # (python3 -m tvgw.scrub: no home address, MAC, host, TV or Wi-Fi name reaches the public log),
        # and a failure anywhere in a pipe fails the step. The checkout's own code, as root, with only
        # PYTHONPATH handed over: -P keeps the working directory off the path and -s the user's site
        # (-I would also drop PYTHONPATH, and the system Python has no tvgw of its own), and -B writes
        # no bytecode: a root-owned __pycache__ in the runner's workspace fails the next checkout's clean
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; the token must not stay in .git/config on the runner
          fetch-depth: 0 # (deploy window) the trailer read walks every commit of the push; the wait reads main
      - name: a scheduled run goes on only while a deferred deploy waits
        id: waiting
        if: github.event_name == 'schedule'
        run: |
          if sudo test -e /var/lib/tvgw/deploy-deferred; then
            echo "a deferred deploy waits for the quiet window"
            echo "waiting=yes" >>"$GITHUB_OUTPUT"
          else
            echo "no deferred deploy: nothing to do"
          fi 2>&1 | sudo env PYTHONPATH=src python3 -B -P -s -m tvgw.scrub --stdin
      - name: the deploy window
        # a push whose commits carry Deploy-window: tv-off, or change what the trailer is for, waits for
        # the quiet window, and so does any run while a deferred deploy waits. tvgw tv quiet runs from
        # the checkout, so it works before the gateway's own tvgw has it, and prints one line, never the
        # reason. A scheduled run never asks here and never deploys from this step. It goes on only when
        # the marker's commit, the newest one a tested push deferred, vouches for its checkout (the same
        # commit, or one ahead of it only by paths no CI run exists for), and then takes the wait up:
        # the wait reads main from the remote at once, makes the checkout main's head before a deploy,
        # and asks on the half hours only. So the schedule never deploys a head whose tests did not
        # pass, nor a commit that is no longer main's head, nor between two half hours.
        # Nothing here compares the run's commit with refs/remotes/origin/main, and nothing should:
        # actions/checkout makes that ref the run's own commit, also when main moved on after the run
        # was created, so the two are always equal, and a scheduled run that queued for hours behind a
        # wait would pass the comparison with a commit main has left behind
        id: window
        if: github.event_name == 'push' || steps.waiting.outputs.waiting == 'yes'
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          {
            if [ "$EVENT" = schedule ]; then
              # the marker is a file: its text is held to a commit id, every digit named (a range such
              # as a-f follows the locale), before it reaches git or this step's outputs
              vouched=$(sudo cat /var/lib/tvgw/deploy-deferred) || vouched=""
              id='^([0123456789abcdef]{40}|[0123456789abcdef]{64})$'
              if ! [[ "$vouched" =~ $id ]]; then
                echo "the marker does not hold a commit id: this run takes no wait and deploys nothing; a tested push that defers writes it again"
                echo "deploy=skip" >>"$GITHUB_OUTPUT"
                exit 0
              fi
              rc=0
              python3 -I tools/wait_deploy_window.py --vouches "$vouched" || rc=$?
              case "$rc" in
                0) ;;
                1)
                  echo "the commit that waits does not vouch for this run's commit: this run takes no wait and deploys nothing"
                  echo "deploy=skip" >>"$GITHUB_OUTPUT"
                  exit 0
                  ;;
                *) echo "::error::wait_deploy_window.py --vouches exited $rc"; exit 1 ;;
              esac
              echo "a deferred deploy waits, and its commit vouches for this checkout: this scheduled run takes the wait up"
              echo "deploy=deferred" >>"$GITHUB_OUTPUT"
              echo "vouched=$vouched" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            vouched=$GITHUB_SHA
            need=$(python3 -I tools/check_deploy_window.py --deploy "$BEFORE")
            if sudo test -e /var/lib/tvgw/deploy-deferred; then
              echo "a deferred deploy waits: this push waits with it"
              need=tv-off
            fi
            if [ "$need" != tv-off ]; then
              echo "deploy=plain" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            rc=0
            verdict=$(sudo env PYTHONPATH=src python3 -B -P -s -m tvgw tv quiet --wait 0) || rc=$?
            echo "$verdict"
            case "$rc:$verdict" in
              "0:deploy: now") echo "deploy=now" >>"$GITHUB_OUTPUT" ;;
              "1:deploy: deferred")
                echo "deploy=deferred" >>"$GITHUB_OUTPUT"
                echo "vouched=$vouched" >>"$GITHUB_OUTPUT"
                ;;
              *) echo "::error::tvgw tv quiet exited $rc without its one line"; exit 1 ;;
            esac
          } 2>&1 | sudo env PYTHONPATH=src python3 -B -P -s -m tvgw.scrub --stdin
      - name: deferred to the quiet window
        # the marker names the newest commit a tested push deferred. Only a push writes it: its tests
        # passed, or this job would not run. A scheduled run that defers leaves the marker as it is, and
        # so does a re-run of an older push's job while the marker names a commit that descends from
        # that push's: the marker never goes back to an older commit. Everything else writes it, a git
        # error included: a marker that names a commit this checkout lacks, or no commit at all, must
        # still give way to a tested push
        if: steps.window.outputs.deploy == 'deferred'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          {
            if [ "$EVENT" = push ]; then
              old=""
              if sudo test -e /var/lib/tvgw/deploy-deferred; then
                old=$(sudo cat /var/lib/tvgw/deploy-deferred) || old=""
              fi
              id='^([0123456789abcdef]{40}|[0123456789abcdef]{64})$'
              if [[ "$old" =~ $id ]] && [ "$old" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$old"; then
                echo "the marker names a newer commit than this run's: it stays as it is"
              else
                # the state directory's files are root's and never world-readable (the hardware suite holds
                # every one of them to it); tee alone would leave the marker at the runner's umask, 0644
                sudo install -m 0640 /dev/null /var/lib/tvgw/deploy-deferred
                printf '%s\n' "$GITHUB_SHA" | sudo tee /var/lib/tvgw/deploy-deferred >/dev/null
              fi
            fi
            echo "::notice::deploy: deferred to the gateway's quiet window; this run waits for it on the gateway"
          } 2>&1 | sudo env PYTHONPATH=src python3 -B -P -s -m tvgw.scrub --stdin
      - name: wait for the quiet window on the gateway
        # GitHub's schedule cannot be relied on to start a run inside a two-hour window, and the
        # gateway's clock can, so the run that deferred stays here. The tool asks tvgw tv quiet on the
        # local half hours only, the same times every day, and prints nothing but its last line. The
        # log then shows which half hour of the fixed window let the deploy through, and so that the
        # ones before it in this wait did not, as the 30-minute retry showed before; it shows no time
        # between them. The tool reads main every 5 minutes and ends without a deploy once main's head
        # is one the waiting commit does not vouch for (a newer push with a run of its own), which
        # frees the gateway's one runner for that run; on `now` it has made the checkout main's head
        id: wait
        if: steps.window.outputs.deploy == 'deferred'
        timeout-minutes: 1345 # a little over the tool's own limit of 22 h 15 min
        env:
          VOUCHED: ${{ steps.window.outputs.vouched }}
        run: python3 -I tools/wait_deploy_window.py --wait "$VOUCHED" 2>&1 | sudo env PYTHONPATH=src python3 -B -P -s -m tvgw.scrub --stdin
      - name: deploy this checkout and run the hardware suite against the live gateway
        # as root: earlier suite runs leave root-owned __pycache__ under /opt/tvgw/src. One step under
        # one install lock: the rsync into /opt/tvgw/src, install.sh and the suite, so a `make deploy`
        # can neither mix its tree into this install nor swap it under the suite. One variable for
        # root, not the runner's whole environment (sudo -E). Its own timeout: the job's holds the wait too
        id: deploy
        if: >-
          steps.window.outputs.deploy == 'now' || steps.window.outputs.deploy == 'plain'
          || steps.wait.outputs.deploy == 'now'
        timeout-minutes: 90
        run: sudo deploy/sync-install.sh env PYTHONDONTWRITEBYTECODE=1 PYTHONUTF8=1 /opt/tvgw-venv/bin/python -m pytest -m hardware tests/hardware -q -p no:cacheprovider 2>&1 | sudo env PYTHONPATH=src python3 -B -P -s -m tvgw.scrub --stdin
      - name: the deferred deploy has run
        # passed or failed, the waiting deploy has had its turn; a failed one is a failed job, as any is.
        # Only after a deploy step that ran: a window or wait step that wrote `now` and then failed (in
        # its scrubber) deploys nothing, and the marker of a deploy that never ran must stay
        if: >-
          !cancelled()
          && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure')
          && (steps.window.outputs.deploy == 'now' || steps.wait.outputs.deploy == 'now')
        run: |
          {
            sudo rm -f /var/lib/tvgw/deploy-deferred
            echo "nothing waits for the quiet window"
          } 2>&1 | sudo env PYTHONPATH=src python3 -B -P -s -m tvgw.scrub --stdin

  mutation:
    # mutation testing is slow; runs weekly and on demand, never blocks a push. Only the weekly
    # schedule: the 30-minute one is the deferred deploy's backstop
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'schedule' && github.event.schedule == '17 6 * * 1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; the token must not stay in .git/config on the runner
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: mutmut run
      - run: mutmut results
