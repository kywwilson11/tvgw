name: release

# Builds the .deb for arm64 and amd64 and, on a tag, publishes the release (docs/project/packaging.md#releases).
# A tag vX.Y.Z builds version X.Y.Z, which must be the version in pyproject.toml, and is refused before
# anything is built when CHANGELOG.md's section for X.Y.Z lacks its Highlights or Status. Each package is
# installed in clean Debian 13 and Ubuntu 24.04 containers of its own architecture, where the platform
# check runs on what it installed (packaging/check-platform.sh --package); then the release is
# created as a draft, given both packages, get.sh (the installer, with their hashes written in),
# SHA256SUMS and the notes, and only then published, with the packages and get.sh attested; then the
# documentation site's workflow is started on main, since a release a job's token published starts no
# workflow. A manual run builds and checks the same files from the chosen ref and keeps them as workflow
# artifacts only. Nothing here deploys: no job of any workflow runs on a gateway (design decision 83).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: the release notes can be written from the changelog (a tag only)
        if: github.ref_type == 'tag'
        run: >-
          python3 -I packaging/release_notes.py --version "${GITHUB_REF_NAME#v}"
          --changelog CHANGELOG.md --template .github/release-notes.md.in
      - name: the gate the packages must pass (lint, format, shellcheck, unit tests)
        run: |
          python -m pip install -e ".[dev]"
          make gate

  deb:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [arm64, amd64]
    env:
      NFPM_VERSION: "2.48.0"
      # from the release's checksums.txt, and checked against the downloaded file on 2026-11-01
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: install nfpm, pinned and checked by hash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"
      - name: build the .deb
        # nfpm and pip build the arm64 package on the x86_64 runner, like the amd64 one
        env:
          TVGW_ARCH: ${{ matrix.arch }}
          TVGW_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: packaging/build-deb.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tvgw-deb-${{ matrix.arch }}
          path: dist/tvgw_*.deb
          if-no-files-found: error

  # each package installed in clean containers of its own architecture, as a user would install it; one
  # job per architecture, because a runner is named by a literal label, never an expression
  install-check-arm64:
    needs: deb
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # the official images' multi-architecture indexes, read from Docker Hub on 2026-11-03
        image:
          - debian:13@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1
          - ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    container:
      image: ${{ matrix.image }}
      # the platform check's dummy ports and `nft -c` need NET_ADMIN; its dumpcap run needs NET_RAW
      options: --cap-add=NET_ADMIN --cap-add=NET_RAW
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tvgw-deb-arm64
          path: dist
      # packaging/install-check.sh installs the package as a user would and checks its wheelhouse, tvgw
      # --version and the imports; then the package's own files go through the platform check
      - run: sh packaging/check-platform.sh --package dist/tvgw_*-1_arm64.deb

  install-check-amd64:
    needs: deb
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # the official images' multi-architecture indexes, read from Docker Hub on 2026-11-03
        image:
          - debian:13@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1
          - ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    container:
      image: ${{ matrix.image }}
      # the platform check's dummy ports and `nft -c` need NET_ADMIN; its dumpcap run needs NET_RAW
      options: --cap-add=NET_ADMIN --cap-add=NET_RAW
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tvgw-deb-amd64
          path: dist
      # packaging/install-check.sh installs the package as a user would and checks its wheelhouse, tvgw
      # --version and the imports; then the package's own files go through the platform check
      - run: sh packaging/check-platform.sh --package dist/tvgw_*-1_amd64.deb

  # the release's own files and, on a tag, their provenance. The one job that can sign: it runs this
  # repository's scripts and pinned actions only, never the build's third-party code
  assets:
    needs: deb
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # a Sigstore certificate for the attestation
      attestations: write # the attestation, stored with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tvgw-deb-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS, and get.sh with both packages' hashes written in
        run: |
          V=$(python3 -I -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          packaging/release-assets.sh "$V" dist
      - name: the release notes (a tag only)
        if: github.ref_type == 'tag'
        run: >-
          python3 -I packaging/release_notes.py --version "${GITHUB_REF_NAME#v}"
          --changelog CHANGELOG.md --template .github/release-notes.md.in
          --sums dist/SHA256SUMS --out dist/RELEASE_NOTES.md
      - name: attest that this workflow built the packages and the installer (a tag only)
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/tvgw_*.deb
            dist/get.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tvgw-release
          path: dist/
          if-no-files-found: error

  publish:
    needs: [assets, install-check-arm64, install-check-amd64]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # two runs for one tag never race to create its release
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # create the release and upload its files; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tvgw-release
          path: dist
      - name: a draft first, every file uploaded to it, then published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: packaging/publish-release.sh "$GITHUB_REF_NAME" dist

  # the documentation site, once the release is out. GitHub starts no workflow from an event a job's own
  # token caused, workflow_dispatch and repository_dispatch excepted, so the release published above
  # fires no `release` event in pages.yml. This starts pages.yml on main instead, and its gate decides
  # as for any run on main (docs/site/README.md#when-it-publishes): while main's head is this release's
  # tag, every command the pages name is in the release and the site publishes; once main has moved
  # past the tag, the command check decides. A patch to an older line starts it too, which publishes
  # nothing a push to main would not. The release stands either way: a failure to start the site is a
  # warning that names the command to run by hand, never a failed run
  site:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # start pages.yml on main with a workflow_dispatch; nothing else
    steps:
      - name: start the documentation site on main (a failure here leaves the release published)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh workflow run pages.yml --ref main; then
            echo "started docs-site (pages.yml) on main for $GITHUB_REF_NAME; its gate decides whether the site is published"
          else
            echo "::warning::the documentation site was not started for $GITHUB_REF_NAME (gh said why above); the release is published. Start it by hand: gh workflow run pages.yml --ref main --repo $GITHUB_REPOSITORY"
          fi
