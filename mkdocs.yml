# The documentation site: a view of docs/ and the front page, built by Zensical (docs/site/README.md).
#
#   make site     # prebuild, strict build and the HTML check, into build/site
#
# docs/site/prebuild.py copies docs/ into build/site-docs: the front page (README.md at the root) becomes
# the home page index.md, the landing page docs/README.md becomes map.md, links that leave docs/ point
# at the file on GitHub at the commit built, and the badge row is dropped. Every page stays plain
# Markdown with relative links, so GitHub stays a complete reading of the same files.
#
# Only keys that Zensical 0.0.74 and Material for MkDocs 9.8.0 (on MkDocs 1.6.1) both read are used, so
# `mkdocs build --strict` with Material is a fallback until Material's maintenance ends (2027-05-05).
# No plugins beyond search, no hooks, no overrides directory, no custom CSS or JavaScript.

site_name: tvgw
site_description: >-
  A small computer between your smart TV and the internet. It blocks the TV's tracking, keeps it away
  from your other devices, and tells you every day what the TV tried to do.
site_url: https://kywwilson11.github.io/tvgw/
# the header's repository link; its widget asks api.github.com for the star count, the one request the
# site makes to another party, and GitHub hosts the site anyway
repo_url: https://github.com/kywwilson11/tvgw
repo_name: kywwilson11/tvgw
# the edit pencil opens the page's source on GitHub; index.md and map.md are copies of README.md and
# docs/README.md, so theirs lead nowhere (docs/site/README.md#gotchas)
edit_uri: edit/main/docs/
copyright: tvgw is MIT licensed.

docs_dir: build/site-docs # written by docs/site/prebuild.py; never edited by hand
site_dir: build/site # Zensical refuses a site_dir outside the folder that holds mkdocs.yml

# name.html, not name/index.html: the figures are raw <picture> HTML with paths relative to the page
# (docs/diagrams/STYLE.md), which no generator rewrites, so a page one folder deeper would lose them
use_directory_urls: false

strict: true
validation:
  nav:
    omitted_files: info # the records, the research and the stubs of moved pages are reached by link
    not_found: warn
    absolute_links: info
  links:
    not_found: warn # strict makes every warning an error: a broken link fails the build
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

theme:
  name: material
  language: en
  # no Google Fonts: by default both generators make every reader's browser fetch fonts from
  # fonts.googleapis.com and fonts.gstatic.com. A privacy project's site makes no third-party request
  # it does not need; the system font stack reads as well
  font: false
  features:
    - navigation.tabs # the seven sections as tabs across the top on a wide screen
    - navigation.tabs.sticky
    - navigation.sections # a tab's pages grouped under headings in the sidebar
    - navigation.indexes # a section's README is its landing page
    - navigation.footer # previous and next page at the foot: the reading order, on every page
    - navigation.top # a back-to-top button on long pages
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy # a copy button on every command block, the typical reader's main need
    - content.action.edit
    - toc.follow
  # Light and dark follow the reader's system setting, as GitHub shows the figures' <picture> elements.
  # A manual toggle needs prebuild.py --picture-toggle, which rewrites each <picture> into the
  # #only-light / #only-dark pair the theme switches; until that is tested on a deployed page, no toggle
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true
      # anchors exactly as GitHub makes them, so one link works on both: GitHub keeps every hyphen
      # ("--no-check-update" gives "---no-check-update"), the default slug collapses them
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  # GitHub's alert syntax (> [!NOTE], > [!WARNING]) renders on GitHub and, with the github-callouts
  # extension (markdown-callouts), on the site as the theme's admonition. Uncomment it, and add
  # markdown-callouts to docs/site/requirements.in, in the change that first uses an alert on a page.
  # - github-callouts

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kywwilson11/tvgw
      name: tvgw on GitHub

