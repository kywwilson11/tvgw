[build-system]
requires = ["setuptools>=77", "wheel"]  # 77: a licence expression and license-files (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "tvgw"
version = "0.4.0"
description = "Raspberry Pi gateway that isolates, observes and filters a smart TV"
readme = "README.md"
# (companies) the code is MIT; src/tvgw/data/companies.txt is CC BY-SA 4.0 data (NOTICE)
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "kywwilson11" }]
keywords = ["smart-tv", "privacy", "adguard", "nftables", "raspberry-pi", "webos"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
lgwebos = ["bscpylgtv>=0.5"]
analyst = ["anthropic>=2.0,<3"]
dev = ["pytest>=8", "pytest-xdist>=3.6", "ruff>=0.15,<0.18", "mutmut>=3.2"]

[project.scripts]
tvgw = "tvgw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tvgw = ["profiles/*.toml", "profiles/*.rules", "profiles/*.json", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
markers = ["hardware: needs the live gateway (run on the Pi with -m hardware tests/hardware)"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # verbatim log lines and base64 fixtures are long on purpose

[tool.mutmut]
paths_to_mutate = ["src/tvgw/"]
tests_dir = ["tests/unit/"]
# lgwebos.py needs a TV; it should not shape the score.
do_not_mutate = ["src/tvgw/lgwebos.py"]
