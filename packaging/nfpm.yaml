# nfpm configuration for the tvgw .deb (https://nfpm.goreleaser.com/docs/configuration/).
# Run through packaging/build-deb.sh (`make deb`), which stages build/deb/ and sets TVGW_VERSION and
# TVGW_ARCH; nfpm alone would package whatever build/deb/ holds. What goes where, and why the
# maintainer scripts hand everything to deploy/install.sh, is in docs/project/packaging.md.
name: tvgw
arch: ${TVGW_ARCH}
platform: linux
version: ${TVGW_VERSION}
version_schema: semver
release: "1"
section: net
priority: optional
maintainer: kywwilson11 <kywwilson11@users.noreply.github.com>
# the first line is Debian's synopsis (under 80 characters, no full stop); nfpm turns the blank line into
# the " ." that separates the paragraphs of the long description
description: |-
  privacy gateway for a smart TV
  Privacy gateway for a smart TV: blocks its tracking, keeps it off your
  home network, reports daily. The TV's only way out is the gateway, which
  forces its lookups through AdGuard Home, blocks the ways around it and
  records what the TV does.

  AdGuard Home is not part of this package. tvgw runs on a Raspberry Pi and
  other 64-bit Debian-based computers.
homepage: https://github.com/kywwilson11/tvgw
# (companies) MIT code, and one file of CC BY-SA 4.0 data: packaging/copyright and NOTICE
license: MIT AND CC-BY-SA-4.0

# Debian names. AdGuard Home has no .deb: preinst refuses the install when it is missing or older
# than the version floor, with the command that installs it.
depends:
  - python3 (>= 3.11)
  - python3-venv
  - nftables
  - iproute2
  - procps
  - kmod
  - util-linux
  - network-manager
  - dnsmasq
  - nginx
  - libnginx-mod-stream
  - tcpdump
  - conntrack
  - tshark
  - wireshark-common # dumpcap, the capture (tshark depends on it too)
  - curl
  - ca-certificates
  - systemd
recommends:
  - logrotate

contents:
  # the tree install.sh runs from, and the offline, hash-pinned wheelhouse it installs
  - src: ./build/deb/deploy
    dst: /usr/lib/tvgw/deploy
    type: tree
  - src: ./build/deb/wheels
    dst: /usr/lib/tvgw/wheels
    type: tree
  - src: ./build/deb/requirements.lock
    dst: /usr/lib/tvgw/requirements.lock
    file_info:
      mode: 0644
  - src: ./build/deb/SHA256SUMS
    dst: /usr/lib/tvgw/SHA256SUMS
    file_info:
      mode: 0644
  # (companies) Debian's machine-readable copyright: MIT for the code, CC BY-SA 4.0 for the companies data
  - src: ./packaging/copyright
    dst: /usr/share/doc/tvgw/copyright
    file_info:
      mode: 0644
  - src: ./NOTICE
    dst: /usr/share/doc/tvgw/NOTICE
    file_info:
      mode: 0644
  - src: ./docs/project/packaging.md
    dst: /usr/share/doc/tvgw/packaging.md
    file_info:
      mode: 0644

scripts:
  preinstall: ./packaging/scripts/preinst
  postinstall: ./packaging/scripts/postinst
  preremove: ./packaging/scripts/prerm
  postremove: ./packaging/scripts/postrm

deb:
  compression: xz
