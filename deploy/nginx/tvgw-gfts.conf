# tvgw: URL filter for LG's GFTS file service (plain HTTP, port 80).
# AdGuard rewrites ngfts.lge.com, aic-ngfts.lge.com, aic-img-ngfts.lge.com and gfts.lge.com to
# 10.10.10.1, so the TV talks to this server; it forwards to the real host (resolved through PIA's
# resolver, since the Pi's own DNS must not go elsewhere) except for the side-channel downloads:
#   PREMIUM    ACR configuration file          CDP   telemetry schedule
#   LGSHOPPING LG Shopping data/images         MAS   home-screen promo thumbnails
#   IBS        LG Channels guide/channel art
# App Store packages/icons (APP_STORE, SVCSH, META_IMG) and anything else pass through.
# Installed as /etc/nginx/conf.d/tvgw-gfts.conf; reload with `sudo systemctl reload nginx`.

# tvgw.gfts parses this; new fields go at the end so older lines stay readable
log_format tvgw_gfts '$time_iso8601 $remote_addr $status $body_bytes_sent $request_time "$host" "$request_uri" "$http_user_agent" $request_method $request_length "$upstream_status"';

server {
	listen 10.10.10.1:80 default_server;
	server_name ngfts.lge.com aic-ngfts.lge.com aic-img-ngfts.lge.com gfts.lge.com;
	access_log /var/log/tvgw/gfts.log tvgw_gfts;
	resolver __RESOLVER__ valid=300s ipv6=off;

	if ($request_uri ~* "biz_code=(PREMIUM|CDP|LGSHOPPING|MAS|IBS)([&_]|$)") {
		return 403;
	}
	# Only the rewritten LG names belong here; anything else is a misrouted request
	if ($host !~* "^(aic-|aic-img-)?n?gfts\.lge\.com$") {
		return 444;
	}

	location / {
		proxy_pass http://$host$request_uri;
		proxy_set_header Host $host;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_buffering off;
		proxy_connect_timeout 10s;
		proxy_read_timeout 300s;
		client_max_body_size 64m;
	}
}
