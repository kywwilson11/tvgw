# tvgw (design decision 42): nginx's workers parse the TV's HTTP and TLS hellos. install.sh appends
# these lines to the nginx.service.d/tvgw.conf drop-in, restarts nginx once when the drop-in changed,
# and puts the drop-in back as it was without them if nginx is not then active and listening on
# GW_IP:80 and :443. MemoryDenyWriteExecute=yes is added only when `nginx -T` shows no `pcre_jit on`
# (PCRE2's JIT needs writable executable memory), AF_INET6 only when it shows a `listen [` address.
# Beside 11 F7's set: CAP_KILL, which the master needs to signal workers that run as www-data when the
# channel to them fails (src/os/unix/ngx_process_cycle.c), and AF_NETLINK, which glibc's getaddrinfo
# uses for AI_ADDRCONFIG when a config names an upstream by host name.
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_CHOWN CAP_DAC_OVERRIDE CAP_KILL
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=-/var/log/nginx -/var/log/tvgw -/var/lib/nginx -/run
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
