# tvgw: TLS passthrough for the GFTS hosts that AdGuard rewrites to the Pi (see nginx-tvgw-gfts.conf).
# The Content Store also reaches gfts.lge.com over HTTPS; this hands the TLS session to the real
# host by SNI without decrypting it. Included from /etc/nginx/nginx.conf at top level.

stream {
	log_format tvgw_tls '$time_iso8601 $remote_addr $status $bytes_sent $bytes_received $session_time "$ssl_preread_server_name"';
	resolver 10.0.0.243 valid=300s ipv6=off;

	map $ssl_preread_server_name $tvgw_upstream {
		~^(aic-|aic-img-)?n?gfts\.lge\.com$ $ssl_preread_server_name;
		default "";
	}

	server {
		listen 10.10.10.1:443;
		ssl_preread on;
		access_log /var/log/tvgw/gfts-tls.log tvgw_tls;
		proxy_pass $tvgw_upstream:443;
		proxy_connect_timeout 10s;
		proxy_timeout 300s;
	}
}
