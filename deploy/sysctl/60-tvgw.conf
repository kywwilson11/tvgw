# tvgw: the conntrack switches tvgw-apply sets at every apply, held from boot as well
# (deploy/sysctl/README.md). install.sh installs this file as /etc/sysctl.d/60-tvgw.conf.
# Byte and packet counts on every connection: the flow log's sizes and the payload gate.
net.netfilter.nf_conntrack_acct = 1
# Start and stop times on every connection: the flow log's timestamps.
net.netfilter.nf_conntrack_timestamp = 1
# No connection makes conntrack events unless the firewall asks for them: tvgw-apply's ct_events chain
# asks for the TV's, so the flow logger hears the TV and nothing else (design decision 43).
net.netfilter.nf_conntrack_events = 0
